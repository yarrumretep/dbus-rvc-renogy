name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run offline test suite
        run: >-
          python -m unittest -v
          test_dbus_rvc_renogy.py
          test_rvc_inventory.py
          test_package_layout.py

      - name: Compile Python entry points
        run: python -m py_compile dbus-rvc-renogy.py rvc-inventory.py
